<!DOCTYPE html>
<!--
  SISTEMA ERP - NICARAGUA
  ARCHIVO: index.html
  RUTA: src/main/resources/static/index.html

  QUÉ HACE:
  Punto de entrada único de la interfaz web (Single Page Shell). Define la estructura del layout
  (sidebar colapsable, topbar, contenedor dinámico #app-content), la pantalla de login y los
  contenedores para modales y notificaciones.

  POR QUÉ EXISTE:
  Permite alojar la experiencia completa del ERP en Vanilla HTML5/CSS3/JavaScript sin dependencias externas.

  CÓMO SE CONECTA CON EL RESTO:
  Carga styles.css e incluye los módulos JavaScript (api.js, auth.js, menu.js, usuarios.js, roles.js, app.js).
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema ERP - Nicaragua</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div id="login-screen">
        <div class="login-box">
            <div class="login-header">
                <h2>SISTEMA ERP</h2>
                <p>Nicaragua - Plataforma Empresarial</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Usuario</label>
                    <input type="text" id="login-username" class="form-control" required placeholder="Ingrese su usuario" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" required placeholder="Ingrese su contraseña" autocomplete="current-password">
                </div>
                <div style="margin-bottom: 1.25rem; font-size: 0.8rem; background-color: #f1f5f9; padding: 0.65rem 0.85rem; border-radius: 6px; border: 1px solid #cbd5e1;">
                    <strong>Credenciales iniciales:</strong><br>
                    Usuario: <code>admin</code><br>
                    Contraseña: <code>Admin2026!Temp</code>
                </div>
                <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    Ingresar al ERP
                </button>
            </form>
        </div>
    </div>

    <!-- LAYOUT PRINCIPAL DEL SISTEMA -->
    <div id="app-layout" style="display: none;">
        <!-- SIDEBAR LATERAL -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">ERP NICARAGUA</span>
                <button id="btn-toggle-sidebar" class="sidebar-toggle-btn" title="Alternar Menú">☰</button>
            </div>
            <nav class="sidebar-menu" id="sidebar-menu-container">
                <!-- Se poblará dinámicamente según permisos del usuario -->
            </nav>
        </aside>

        <!-- CONTENEDOR PRINCIPAL -->
        <div id="main-wrapper">
            <!-- BARRA SUPERIOR (TOPBAR) -->
            <header id="topbar">
                <div class="topbar-breadcrumbs" id="topbar-breadcrumb">
                    Seguridad > Usuarios
                </div>
                <div class="topbar-user">
                    <div class="user-badge">
                        <div class="user-name" id="topbar-user-name">Usuario</div>
                        <div class="user-role" id="topbar-user-role">Rol</div>
                    </div>
                    <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
                </div>
            </header>

            <!-- VISTA ACTIVA DINÁMICA -->
            <main id="app-content">
                <!-- Vistas cargadas por módulos JS -->
            </main>
        </div>
    </div>

    <!-- CONTENEDORES PARA MODALES Y TOASTS -->
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <!-- SCRIPTS EN ORDEN DE DEPENDENCIA -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/usuarios.js"></script>
    <script src="/js/roles.js"></script>
    <script src="/js/clientes.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
